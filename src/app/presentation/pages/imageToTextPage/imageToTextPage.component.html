<div class="chat-container">
  <div class="chat-messages">

    <div class="grid gap-y-2">

      <!-- Chat Messages -->
      <app-chat-message [text]="'Agrega una imagen y dime que necesitas que te diga sobre ella.'" [isUser]="false" [iconLetter]="'G'" />

      @for (message of messages(); track $index) {
      @if( message.isGpt ) {
          <app-chat-message [text]="message.text" [isUser]="false" [iconLetter]="'G'" />
        } @else {
          <app-chat-message [text]="message.text" [isUser]="true" [iconLetter]="'Y'" />
        }
      }

      @if (isLoading()) {
        <app-typing-loader />
      }

    </div>
  </div>

  <!-- MessageBox -->
  <app-text-message-box-file placeholder="Escribe aquí lo que deseas" (onMessage)="handleMessageWithFile($event)" />

</div>
