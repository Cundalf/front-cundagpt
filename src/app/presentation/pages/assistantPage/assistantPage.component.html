<div class="chat-container">
  <div class="chat-messages">

    <div class="grid gap-y-2">

      <!-- Chat Messages -->
      <app-chat-message text="Saludos, soy Sam, ¿Cuál es tu nombre? y ¿En qué puedo ayudarte?" [isUser]="false" iconLetter="S" />

      @for (message of messages(); track $index) {
        @if( message.isGpt ) {
          <app-chat-message [text]="message.text" [isUser]="false" [iconLetter]="'S'"/>
        } @else {
          <app-chat-message [text]="message.text" [isUser]="true" [iconLetter]="'Y'" />
        }
      }

      @if (isLoading()) {
      <app-typing-loader />
      }

    </div>
  </div>

  <!-- MessageBox -->
  <app-text-message-box placeholder="Escribe aquí lo que deseas" (onMessage)="handleMessage($event)" />

</div>
